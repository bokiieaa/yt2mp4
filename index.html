<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Video Downloader</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h1 { font-size: 24px; color: #1a1a1a; margin-bottom: 20px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #cc0000; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 14px; color: #666; word-break: break-all; }
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #00875a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .download-btn:hover { background-color: #006644; }
        .error-box {
            background: #ffebe9;
            color: #d73a49;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(27,31,35,0.15);
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Universal Downloader</h1>
    <input type="text" id="videoUrl" placeholder="Paste YouTube Link here..." />
    <button id="convertBtn" onclick="convertVideo()">Get Download Link</button>
    <div id="status"></div>
</div>

<script>
    async function convertVideo() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const statusDiv = document.getElementById('status');
        const convertBtn = document.getElementById('convertBtn');

        if (!urlInput) {
            statusDiv.innerHTML = "<div class='error-box'>Please paste a valid link.</div>";
            return;
        }

        statusDiv.innerText = "Processing video stream via open-source node...";
        convertBtn.disabled = true;

        try {
            // Using a highly reliable public open-source instance endpoint
            const response = await fetch("https://cobalt.tools", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    url: urlInput,
                    videoQuality: "720", // Standard clean download with audio embedded
                    filenamePattern: "basic"
                })
            });

            const data = await response.json();

            if (data && data.url) {
                statusDiv.innerHTML = `
                    <p style='color: #00875a; font-weight: bold;'>Success! File Ready</p>
                    <a href="${data.url}" target="_blank" class="download-btn">Click to Save MP4</a>
                `;
            } else if (data && data.text) {
                statusDiv.innerHTML = `<div class='error-box'>Server Error: ${data.text}</div>`;
            } else {
                statusDiv.innerHTML = "<div class='error-box'>Unable to extract video from this link. The node might be rate-limited.</div>";
            }

        } catch (error) {
            console.error(error);
            statusDiv.innerHTML = `<div class='error-box'>Network Exception: ${error.message}</div>`;
        } finally {
            convertBtn.disabled = false;
        }
    }
</script>

</body>
</html>
