<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 { font-size: 24px; color: #1a1a1a; margin-bottom: 20px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #cc0000; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 14px; color: #333; text-align: left; }
        .format-list {
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 5px;
        }
        .format-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #f5f5f5;
        }
        .format-item:last-child { border-bottom: none; }
        .download-btn {
            padding: 6px 14px;
            background-color: #00875a;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }
        .download-btn:hover { background-color: #006644; }
        .error-box {
            background: #ffebe9;
            color: #d73a49;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(27,31,35,0.15);
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>YouTube CDN Downloader</h1>
    <input type="text" id="videoUrl" placeholder="Paste YouTube Link or Video ID..." />
    <button id="convertBtn" onclick="convertVideo()">Extract Links</button>
    <div id="status"></div>
</div>

<script>
    const RAPIDAPI_KEY = "04a077fb2amsh01b68f93dfc0c8bp14771bjsnced32557f20f"; 
    const RAPIDAPI_HOST = "://rapidapi.com";
    const PROXY_URL = "https://corsproxy.io?";

    // Helper function to extract 11-character video ID or fallback to standard URL input
    function parseInput(val) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = val.match(regExp);
        if (match && match[2].length === 11) {
            return { type: 'id', value: match[2] };
        }
        if (val.length === 11 && !val.includes('/') && !val.includes('.')) {
            return { type: 'id', value: val };
        }
        return { type: 'url', value: val };
    }

    async function convertVideo() {
        const inputVal = document.getElementById('videoUrl').value.trim();
        const statusDiv = document.getElementById('status');
        const convertBtn = document.getElementById('convertBtn');

        if (!inputVal) {
            statusDiv.innerHTML = "<div class='error-box'>Please paste a YouTube URL or Video ID.</div>";
            return;
        }

        const parsed = parseInput(inputVal);
        statusDiv.innerHTML = "<em>Querying CDN node streams...</em>";
        convertBtn.disabled = true;

        try {
            // Build endpoint target URL using the correct id/url query assignment matching the manual
            let targetUrl = `https://${RAPIDAPI_HOST}/stream?`;
            if (parsed.type === 'id') {
                targetUrl += `id=${encodeURIComponent(parsed.value)}`;
            } else {
                targetUrl += `url=${encodeURIComponent(parsed.value)}`;
            }
            
            const response = await fetch(PROXY_URL + encodeURIComponent(targetUrl), {
                method: 'GET',
                headers: {
                    'x-rapidapi-key': RAPIDAPI_KEY,
                    'x-rapidapi-host': RAPIDAPI_HOST
                }
            });

            if (response.status === 403) {
                statusDiv.innerHTML = `
                    <div class='error-box'>
                        <strong>Error 403 (Unauthorized):</strong> Server rejected token verification.<br><br>
                        Make sure you clicked <strong>"Subscribe to Test"</strong> on the <a href="https://rapidapi.com" target="_blank" style="color:#d73a49; font-weight:bold;">RapidAPI Portal Hub</a>.
                    </div>`;
                return;
            }

            if (!response.ok) throw new Error(`CDN backend responded with code: ${response.status}`);

            const data = await response.json();
            console.log("Verified API Response Data:", data);

            // The manual defines the response structure as a direct flat array: [{ quality, url, extension, type }]
            if (data && Array.isArray(data) && data.length > 0) {
                let htmlOutput = `<p style="margin:5px 0;"><strong>Success!</strong> Links isolated:</p><div class="format-list">`;
                
                data.forEach(item => {
                    if (item.url) {
                        const fileExt = (item.extension || 'mp4').toUpperCase();
                        const qualityLabel = item.quality || 'Default';
                        const isMuted = item.type === 'video_only' ? ' <span style="color:#d73a49; font-size:11px;">(Mute)</span>' : '';
                        
                        htmlOutput += `
                            <div class="format-item">
                                <span style="font-size: 13px; font-weight: 500;">${fileExt} - ${qualityLabel}${isMuted}</span>
                                <a href="${item.url}" target="_blank" class="download-btn">Download</a>
                            </div>
                        `;
                    }
                });

                htmlOutput += `</div>`;
                statusDiv.innerHTML = htmlOutput;
            } else {
                statusDiv.innerHTML = `<div class='error-box'><strong>Data Format Error:</strong> The server processed the request but returned an empty array or missing structure.</div>`;
            }

        } catch (error) {
            console.error(error);
            statusDiv.innerHTML = `<div class='error-box'><strong>Exception caught:</strong> ${error.message}</div>`;
        } finally {
            convertBtn.disabled = false;
        }
    }
</script>

</body>
</html>
